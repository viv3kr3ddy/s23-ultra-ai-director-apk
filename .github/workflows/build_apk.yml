name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true
    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
    - name: Create GitHub Release with Direct APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
      with:
        tag_name: v1.0.0
        name: Slingshot Generation Android APK v1.0.0
        files: app/build/outputs/apk/debug/app-debug.apk
      continue-on-error: true
